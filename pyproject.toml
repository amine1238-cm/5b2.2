[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resource_platform*"]

[project]
name = "resource-platform-mvp"
version = "0.1.3"
description = "Resource management MVP increment 3"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0,<5.0",
    "cryptography>=42.0,<51.0",
]

[project.optional-dependencies]
test = [
    "qrcode[pil]>=7.4,<9.0",
    "opencv-python-headless>=4.8,<5.0",
    "psycopg[binary,pool]>=3.1,<4.0",
]
